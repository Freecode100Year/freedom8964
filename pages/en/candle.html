<section class="page-head">
  <div class="wrap">
    <p class="en">Light a Candle</p>
    <h1>Light a Candle</h1>
    <p>For the victims of 1989.</p>
  </div>
</section>

<main>
  <div class="wrap">
    <div class="candle-stage">
      <div class="candle" id="candle" aria-hidden="true">
        <div class="flame"></div><div class="wick"></div><div class="body"></div>

    <div class="note"><strong>Privacy:</strong> the candle is lit only in your browser. Nothing is sent or counted.</div>
  </div>
</main>
